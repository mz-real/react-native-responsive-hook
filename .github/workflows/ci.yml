name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # react-native-builder-bob 0.40 requires ^20.19 || ^22.12 || >=23.4,
        # and `prepare: bob build` runs during `npm ci`. Node 18 is EOL.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

      - name: Check published package (publint, are-the-types-wrong)
        run: npm run lint:package

  types-compat:
    # Type-checks the packed package as an app on a recent React Native
    # (default and strict TypeScript API) would consume it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check consumer against React Native 0.81 (default + strict API)
        run: npm run test:types-compat
