name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # react-native-builder-bob 0.40 requires ^20.19 || ^22.12 || >=23.4,
        # and `prepare: bob build` runs during `npm ci`. Node 18 is EOL.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build
